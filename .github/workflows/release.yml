name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # macOS Build (Apple Silicon & Intel)
  # ==========================================
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_name: arm64
          - target: x86_64-apple-darwin
            arch_name: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-bundle & create-dmg
        run: |
          cargo install cargo-bundle
          brew install create-dmg || true

      - name: Build macOS App Bundle
        run: |
          cargo bundle --release --target ${{ matrix.target }}

      - name: Package DMG and Zip
        run: |
          APP_PATH="target/${{ matrix.target }}/release/bundle/osx/IJson.app"
          DMG_NAME="IJson-${{ matrix.arch_name }}-macos.dmg"
          ZIP_NAME="IJson-${{ matrix.arch_name }}-macos.app.zip"

          mkdir -p artifacts

          # 尝试使用 create-dmg 制作带背景样式的 DMG，若失败则回退至原生 hdiutil
          if create-dmg \
            --volname "IJson" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "IJson.app" 175 120 \
            --hide-extension "IJson.app" \
            --app-drop-link 425 120 \
            "artifacts/$DMG_NAME" \
            "$APP_PATH"; then
            echo "create-dmg succeeded"
          else
            echo "create-dmg failed or timed out, falling back to hdiutil"
            hdiutil create -volname "IJson" -srcfolder "$APP_PATH" -ov -format UDZO "artifacts/$DMG_NAME"
          fi

          # 制作 .app.zip 压缩包
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "artifacts/$ZIP_NAME"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch_name }}
          path: artifacts/*
          if-no-files-found: error

  # ==========================================
  # Windows Build (x86_64 MSVC)
  # ==========================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows Zip
        shell: bash
        run: |
          mkdir -p artifacts
          ZIP_NAME="IJson-x64-windows.zip"
          7z a "artifacts/$ZIP_NAME" \
            ./target/x86_64-pc-windows-msvc/release/IJson.exe \
            README.md \
            LICENSE

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/*
          if-no-files-found: error

  # ==========================================
  # Publish GitHub Release
  # ==========================================
  publish-release:
    name: Publish Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
